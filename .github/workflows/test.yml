name: test

# Installs and tests the formula from this checkout on macOS and Linux.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      # Sets up brew and taps this repository as modulestf/tap. It checks the
      # repository out itself.
      - uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main 2026-11-04
      - run: brew style modulestf/tap/mtf-facts
      - run: brew install modulestf/tap/mtf-facts
      - run: brew test modulestf/tap/mtf-facts
      - run: brew audit --strict modulestf/tap/mtf-facts
